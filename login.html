<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Virtual Hospital</title>
    <link rel="stylesheet" href="login.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="theme-patient">

    <!-- Top Navbar -->
    <nav class="navbar">
        <div class="logo">
            <i class="fa-regular fa-heart icon-color"></i> <a href="HOME.html">Virtual Hospital</a>
        </div>
        <a href="register.html" class="nav-link">Don't have an account? Register</a>
    </nav>

    <!-- Main Login Container -->
    <main class="login-wrapper">
        <div class="login-card">
            
            <h1 class="login-title">Login</h1>
           
            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>

                <button type="submit" class="btn-submit" id="btn-login">Login</button>
            </form>

            <!-- Footer Link -->
            <div class="login-footer">
                <a href="register.html" class="nav-link">Don't have an account? Register here</a>
            </div>

        </div>

        <!-- LOADING OVERLAY -->
        <div id="loading-overlay" class="hidden">
            <div class="loading-box">
                <div class="circle-loader"></div>
            </div>
        </div>

        <!-- POPUP -->
        <div id="overlay" class="hidden">
            <div id="warning" class="hidden">
                <div class="popup-msg">
                    <i class="fa-solid fa-triangle-exclamation" style="color: rgb(205, 63, 63);"></i>
                    <p></p>
                </div>
                <div class="popup-btn-grp">
                    <button id="yes">Yes</button>
                    <button id="no">No</button>
                </div>
            </div>
            <div id="positive-response" class="hidden">
                <div class="popup-msg">
                    <i class="fa-solid fa-circle-check" style="color: rgb(19, 168, 19);"></i>
                    <p></p>
                </div>
                <button id="ok-btn" class="popup-btn">Ok</button>
            </div>
            <div id="error-alert" class="hidden">
                <div class="popup-msg">
                <i class="fa-solid fa-circle-xmark"></i>
                <p></p>
                </div>
                <button id="try-btn" class="popup-btn">Try again</button>
            </div>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
