<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Hospital</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<!-- NAVBAR -->
<nav>
  <div class="nav-left">
    <button class="back-btn" onclick="history.back()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back
    </button>
  </div>

  <div class="nav-center">
    
     <i class="fa-solid fa-heart-pulse"></i>
   

    Virtual Hospital
  </div>

  <div class="nav-right">
    <button class="logout-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Logout
    </button>
  </div>
</nav>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-item">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      Profile
    </div>
    <div class="sidebar-item active">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      Find Doctor
    </div>
    <div class="sidebar-item">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      Feedback
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <h1>Welcome to Your Dashboard</h1>
    <p class="subtitle">Find the right specialist for your health needs</p>

    <div class="label">Describe Your Symptoms</div>
    <textarea
      class="symptom-box"
      id="symptomInput"
      placeholder="Example: I have been experiencing chest pain and shortness of breath..."
    ></textarea>

    <br>
    <button class="find-btn" id="findBtn">Find Specialists</button>
  </main>

</div>

<script>
  const input = document.getElementById('symptomInput');
  const btn   = document.getElementById('findBtn');

  input.addEventListener('focus', () => {
    btn.classList.add('visible');
  });

  input.addEventListener('input', () => {
    if (input.value.trim().length > 0) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });

  input.addEventListener('blur', () => {
    if (input.value.trim().length === 0) {
      btn.classList.remove('visible', 'active');
    }
  });
</script>

</body>
</html>
