<!DOCTYPE html> <!-- Browser ke bola hocche eta HTML5 file -->

<html lang="en"> <!-- HTML page start, language English set kora -->

<head> <!-- Head section start -->

  <meta charset="UTF-8"> <!-- Bangla/English sob text thikmoto show korar jonno -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Mobile responsive korar jonno -->

  <title>Virtual Hospital Register</title> <!-- Browser tab er title -->

  <link rel="stylesheet" href="style.css"> <!-- CSS file connect kora hocche -->

</head> <!-- Head section end -->

<body> <!-- Body start, page er visible content ekhane thakbe -->

  <header class="navbar"> <!-- Top navbar start -->

    <div class="logo"> <!-- Left side logo area -->

      <span class="heart">♡</span> <!-- Heart icon show kora hocche -->

      <span>Virtual Hospital</span> <!-- Website name show kora hocche -->

    </div> <!-- Logo area end -->

    <a href="#" class="login-link">Already have an account? Login</a> <!-- Right side login link -->

  </header> <!-- Navbar end -->

  <main class="page"> <!-- Main page content start -->

    <h1>Create Your Account</h1> <!-- Page main heading -->

    <section class="role-box"> <!-- Patient and Doctor card container -->

      <div class="role-card"> <!-- Patient card start -->

        <div class="icon">♙</div> <!-- Patient icon -->

        <h2>Register as Patient</h2> <!-- Patient card title -->

        <p>Find doctors and book appointments</p> <!-- Patient card subtitle -->

      </div> <!-- Patient card end -->

      <div class="role-card"> <!-- Doctor card start -->

        <div class="icon">⚕</div> <!-- Doctor icon -->

        <h2>Register as Doctor</h2> <!-- Doctor card title -->

        <p>Manage your practice and patients</p> <!-- Doctor card subtitle -->

      </div> <!-- Doctor card end -->

    </section> <!-- Role box end -->

    <section class="form-card"> <!-- Main form card start -->

      <form> <!-- Form start -->

        <div class="form-grid"> <!-- Two column input layout start -->

          <div class="input-group"> <!-- Full name input group -->
            <label>Full Name</label> <!-- Full name label -->
            <input type="text" placeholder="John Doe"> <!-- Full name input -->
          </div>

          <div class="input-group"> <!-- Email input group -->
            <label>Email</label> <!-- Email label -->
            <input type="email" placeholder="john@example.com"> <!-- Email input -->
          </div>

          <div class="input-group"> <!-- Username input group -->
            <label>Username</label> <!-- Username label -->
            <input type="text" placeholder="johndoe"> <!-- Username input -->
          </div>

          <div class="input-group"> <!-- Phone number input group -->
            <label>Phone Number</label> <!-- Phone number label -->
            <input type="text" placeholder="+1 234 567 8900"> <!-- Phone number input -->
          </div>

          <div class="input-group"> <!-- Password input group -->
            <label>Password</label> <!-- Password label -->
            <input type="password" placeholder="••••••••"> <!-- Password input -->
          </div>

          <div class="input-group"> <!-- Confirm password input group -->
            <label>Confirm Password</label> <!-- Confirm password label -->
            <input type="password" placeholder="••••••••"> <!-- Confirm password input -->
          </div>

        </div> <!-- Two column input layout end -->

        <div class="input-group full"> <!-- Specialization full width group -->
          <label>Specialization</label> <!-- Specialization label -->
          <select> <!-- Dropdown start -->
            <option>Select Specialization</option> <!-- Dropdown option -->
            <option>Cardiology</option> <!-- Dropdown option -->
            <option>Neurology</option> <!-- Dropdown option -->
            <option>Dermatology</option> <!-- Dropdown option -->
          </select> <!-- Dropdown end -->
        </div>

        <div class="input-group full"> <!-- Qualifications full width group -->
          <label>Qualifications</label> <!-- Qualifications label -->
          <input type="text" placeholder="MBBS, MD (Cardiology)"> <!-- Qualifications input -->
        </div>

        <div class="input-group full"> <!-- Date of birth full width group -->
          <label>Date of Birth</label> <!-- Date of Birth label -->
          <input type="text" placeholder="mm/dd/yyyy"> <!-- Date of Birth input -->
        </div>

        <button class="register-btn" type="submit">Register</button> <!-- Register button -->

      </form> <!-- Form end -->

    </section> <!-- Form card end -->

  </main> <!-- Main page content end -->

</body> <!-- Body end -->

</html> <!-- HTML end -->
