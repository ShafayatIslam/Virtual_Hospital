<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Hospital</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<!-- NAVBAR -->
<nav>
  <div class="nav-left">
    <button class="back-btn" onclick="history.back()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back
    </button>
  </div>

  <div class="nav-center">
    
     <i class="fa-solid fa-heart-pulse"></i>
   

    Virtual Hospital
  </div>

  <div class="nav-right">
    <button class="logout-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Logout
    </button>
  </div>
</nav>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-item">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      Profile
    </div>
    <div class="sidebar-item active">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>

      Find Doctor
    </div>
    <div class="sidebar-item">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      Feedback
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <h1>Welcome to Your Dashboard</h1>
    <p class="subtitle">Find the right specialist for your health needs</p>

    <div class="label">Describe Your Symptoms</div>
    <textarea
      class="symptom-box"
      id="symptomInput"
      placeholder="Example: I have been experiencing chest pain and shortness of breath..."
    ></textarea>

    <br>
    <button class="find-btn" id="findBtn">Find Specialists</button>
  </main>

</div>



<!-- FEEDBACK MODAL -->
<div id="feedbackModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:1000; align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:16px; padding:32px 36px; width:100%; max-width:440px; position:relative; box-shadow:0 8px 40px rgba(0,0,0,0.15);">
    <button id="feedbackClose" style="position:absolute; top:16px; right:18px; background:none; border:none; font-size:20px; color:#999; cursor:pointer; line-height:1;">&#x2715;</button>
    <h2 style="font-size:20px; font-weight:700; color:#1a1a2e; margin-bottom:6px;">Share Your Feedback</h2>
    <p style="font-size:13px; color:#777; margin-bottom:20px;">We'd love to hear about your experience.</p>

    <div style="margin-bottom:16px;">
      <div style="font-size:13px; font-weight:500; color:#444; margin-bottom:8px;">How would you rate your experience?</div>
      <div id="starRating" style="display:flex; gap:6px;">
        <span data-val="1" style="font-size:26px; cursor:pointer; color:#ddd;">&#9733;</span>
        <span data-val="2" style="font-size:26px; cursor:pointer; color:#ddd;">&#9733;</span>
        <span data-val="3" style="font-size:26px; cursor:pointer; color:#ddd;">&#9733;</span>
        <span data-val="4" style="font-size:26px; cursor:pointer; color:#ddd;">&#9733;</span>
        <span data-val="5" style="font-size:26px; cursor:pointer; color:#ddd;">&#9733;</span>
      </div>
    </div>

    <div style="font-size:13px; font-weight:500; color:#444; margin-bottom:8px;">Your Message</div>
    <textarea id="feedbackText" placeholder="Tell us what you think..." style="width:100%; height:110px; border:1px solid #dde0eb; border-radius:10px; padding:12px 14px; font-family:inherit; font-size:14px; color:#333; resize:none; outline:none; transition:border-color 0.2s; line-height:1.5;"></textarea>

    <button id="feedbackSubmit" style="margin-top:16px; width:100%; padding:12px; background:#5b7ff0; color:#fff; border:none; border-radius:10px; font-family:inherit; font-size:15px; font-weight:500; cursor:pointer; transition:background 0.2s;">Submit Feedback</button>

    <div id="feedbackSuccess" style="display:none; margin-top:14px; align-items:center; justify-content:center; gap:8px; color:#22c55e; font-size:14px; font-weight:500;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Thank you! Feedback submitted.
    </div>
  </div>
</div>

<script>
  // ── Symptom textarea & find button ──
  const input = document.getElementById('symptomInput');
  const btn   = document.getElementById('findBtn');

  input.addEventListener('focus', () => btn.classList.add('visible'));
  input.addEventListener('input', () => {
    input.value.trim().length > 0 ? btn.classList.add('active') : btn.classList.remove('active');
  });
  input.addEventListener('blur', () => {
    if (input.value.trim().length === 0) btn.classList.remove('visible', 'active');
  });

  // ── Sidebar navigation ──
  document.querySelectorAll('.sidebar-item')[0].addEventListener('click', () => {
    window.location.href = "patient_profile.html";
  });

  document.querySelectorAll('.sidebar-item')[2].addEventListener('click', () => {
    document.getElementById('feedbackModal').style.display = 'flex';
  });

  // ── Feedback modal open/close ──
  document.getElementById('feedbackClose').addEventListener('click', () => {
    document.getElementById('feedbackModal').style.display = 'none';
  });

  document.getElementById('feedbackModal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('feedbackModal')) {
      document.getElementById('feedbackModal').style.display = 'none';
    }
  });

  // ── Submit feedback ──
  document.getElementById('feedbackSubmit').addEventListener('click', () => {
    const msg = document.getElementById('feedbackText').value.trim();
    if (!msg) return;
    document.getElementById('feedbackText').value = '';
    selectedRating = 0;
    document.querySelectorAll('#starRating span').forEach(s => s.style.color = '#ddd');
    document.getElementById('feedbackSuccess').style.display = 'flex';
    setTimeout(() => {
      document.getElementById('feedbackSuccess').style.display = 'none';
      document.getElementById('feedbackModal').style.display = 'none';
    }, 2000);
  });

  // ── Star rating ──
  const stars = document.querySelectorAll('#starRating span');
  let selectedRating = 0;
  stars.forEach(star => {
    star.addEventListener('mouseover', () => {
      stars.forEach(s => s.style.color = s.dataset.val <= star.dataset.val ? '#f59e0b' : '#ddd');
    });
    star.addEventListener('mouseout', () => {
      stars.forEach(s => s.style.color = s.dataset.val <= selectedRating ? '#f59e0b' : '#ddd');
    });
    star.addEventListener('click', () => {
      selectedRating = star.dataset.val;
      stars.forEach(s => s.style.color = s.dataset.val <= selectedRating ? '#f59e0b' : '#ddd');
    });
  });

  // ── Feedback textarea focus style ──
  document.getElementById('feedbackText').addEventListener('focus', function() {
    this.style.borderColor = '#5b7ff0';
  });
  document.getElementById('feedbackText').addEventListener('blur', function() {
    this.style.borderColor = '#dde0eb';
  });

  // ── Submit button hover ──
  document.getElementById('feedbackSubmit').addEventListener('mouseover', function() {
    this.style.background = '#4a6de0';
  });
  document.getElementById('feedbackSubmit').addEventListener('mouseout', function() {
    this.style.background = '#5b7ff0';
  });
</script>

</body>
</html>
